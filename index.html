document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

xt-decoration-color:#161616;background:rgba(255,213,77,.45)}\n::selection{background:#FFD54D}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-width: 1200px; overflow-x: hidden; background-color: #FCF9F5\">\n\n<!-- ======================= TOP BAR ======================= -->\n<div style=\"max-width:1240px;margin:0 auto;padding:22px 32px 18px;display:flex;justify-content:space-between;align-items:center\">\n  <div style=\"font-family:'Unbounded',sans-serif;font-size:14px;font-weight:500;letter-spacing:.06em\">АНАСТАСИЯ КОРОЛЁВА<\u002Fdiv>\n  <div style=\"display:flex;gap:28px;align-items:center;font-size:14px\">\n    <a href=\"#cases\" style=\"text-decoration:none\" style-hover=\"background:rgba(255,213,77,.45)\">кейсы<\u002Fa>\n    <a href=\"https://t.me/lxd_by\" target=\"_blank\">t.me/lxd_by<\u002Fa>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n\n<!-- ======================= HERO ======================= -->\n\n\n<section data-screen-label=\"Hero\" style=\"position: relative; max-width: 1240px; margin: 0 auto; padding: 64px 32px 96px; width: 1243px; height: 876px\">\n  <div style=\"position:absolute;left:50%;transform:translateX(-50%);bottom:-140px;width:1200px;height:700px;background:radial-gradient(ellipse at center, #FFBE0F 0%, rgba(255,198,26,0) 62%);opacity:{{ blobOpacity }};pointer-events:none\"><svg sc-camel-view-box=\"0 0 200 60\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; left: 643px; top: 80px; width: 72px; height: 45px; pointer-events: none; overflow: visible\"><ellipse cx=\"100\" cy=\"30\" rx=\"97\" ry=\"27\" fill=\"none\" stroke=\"#161616\" stroke-width=\"1.6\" transform=\"rotate(-2 100 30)\"><\u002Fellipse><\u002Fsvg><\u002Fdiv>\n\n  <div style=\"position: relative; display: inline-block; font-family: 'Unbounded',sans-serif; font-weight: 500; font-size: 82px; line-height: 1.04; letter-spacing: -.01em; width: 473px; height: 116px\">ПРИВЕТ!<\u002Fdiv><div style=\"position:relative\">\n    \n\n    <div style=\"display: grid; grid-template-columns: 340px 1fr; gap: 12px 56px; margin-top: 18px; position: relative\">\n      <!-- photo with handwritten labels -->\n      <div style=\"grid-row:1 / span 2;position:relative;width:300px;height:400px;margin-top:8px\">\n        \n        \n        \n        <div style=\"position:absolute;left:16px;bottom:-46px;font-family:'Neucha',cursive;font-size:22px;transform:rotate(-2deg);white-space:nowrap;display:flex;align-items:flex-end;gap:8px\">\n          <svg width=\"30\" height=\"34\" sc-camel-view-box=\"0 0 36 40\" fill=\"none\" style=\"margin-bottom: 10px; width: 33px; height: 33px\"><path d=\"M30,36 Q26,16 12,6\" stroke=\"#161616\" stroke-width=\"1.7\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M12,15 L12,6 L21,8\" stroke=\"#161616\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n          ДИЗАЙНЕР УЧЕБНОГО ОПЫТА\n        <\u002Fdiv>\n      <x-import component-from-global-scope=\"image-slot\" id=\"hero-photo\" shape=\"rect\" placeholder=\"ваше фото\" hint-size=\"300px,400px\"><\u002Fx-import><\u002Fdiv>\n\n      <div style=\"font-family: 'Unbounded',sans-serif; font-weight: 500; font-size: 82px; line-height: 1.04; letter-spacing: -.01em; align-self: start; width: 484px; height: 86px\">Я&nbsp;НАСТЯ<\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-end;gap:52px;flex-wrap:wrap\">\n        <div style=\"font-family:'Unbounded',sans-serif;font-weight:500;font-size:82px;line-height:1.04;letter-spacing:-.01em\">КОРОЛЁВА<\u002Fdiv>\n        <div style=\"max-width: 360px; font-size: 17px; line-height: 1.6; padding-bottom: 10px; width: 374px; height: 150px; position: relative\">\n          Перешла из digital в образование, чтобы создавать значимое обучение. Через вызов, опыт, рефлексию. С&nbsp;результатом, драйвом и радостью от процесса.\n          <div style=\"margin-top:12px\">Создаю вовлекающее обучение в&nbsp;<a href=\"https://trueducation.ru/\" target=\"_blank\">ТРУ<\u002Fa><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <div style=\"position: absolute; top: 205px; font-family: 'Neucha',cursive; font-size: 26px; transform: rotate(4deg); display: flex; align-items: center; gap: 6px; left: 300px\">\n          <svg width=\"36\" height=\"22\" sc-camel-view-box=\"0 0 44 26\" fill=\"none\" style=\"width: 44px; height: 27px\"><path d=\"M40,20 Q22,24 6,10\" stroke=\"#161616\" stroke-width=\"1.7\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M15,10 L6,10 L11,19\" stroke=\"#161616\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n          LXD\n        <\u002Fdiv><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 40 40\" style=\"position: absolute; top: -9px; left: 1185px\"><polygon points=\"20,0 23.1,12.6 34.1,5.9 27.4,16.9 40,20 27.4,23.1 34.1,34.1 23.1,27.4 20,40 16.9,27.4 5.9,34.1 12.6,23.1 0,20 12.6,16.9 5.9,5.9 16.9,12.6\" fill=\"#161616\"><\u002Fpolygon><\u002Fsvg><\u002Fdiv>\n\n    <sc-if value=\"{{ showDoodles }}\" hint-placeholder-val=\"{{ true }}\">\n      \n      \n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <!-- Belarus note -->\n  <div style=\"position:relative;margin:130px auto 0;max-width:680px;text-align:center\">\n    <div style=\"font-size:21px;line-height:1.65\">В Беларуси понятие «дизайнер образовательного опыта» только-только появляется. Поэтому хочу популяризировать здесь практики проектирования обучения. А&nbsp;также собрать <span style=\"position:relative;display:inline-block\">сообщество таких же энтузиастов<svg sc-camel-view-box=\"0 0 200 12\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position:absolute;left:0;bottom:-9px;width:100%;height:12px\"><path d=\"M2,7 Q50,2 100,7 T198,6\" fill=\"none\" stroke=\"#161616\" stroke-width=\"1.8\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>.<\u002Fdiv>\n    <svg width=\"46\" height=\"62\" sc-camel-view-box=\"0 0 46 62\" fill=\"none\" style=\"margin:18px auto 6px;display:block\"><path d=\"M30,4 Q10,24 22,52\" stroke=\"#161616\" stroke-width=\"1.8\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M12,45 L22,52 L26,41\" stroke=\"#161616\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n    <a href=\"https://t.me/lxd_by\" target=\"_blank\" style=\"display:inline-block;font-family:'Unbounded',sans-serif;font-size:16px;font-weight:500;text-decoration:none;border:1px solid #161616;border-radius:999px;padding:16px 34px;background:#F7F5F1\" style-hover=\"background:radial-gradient(ellipse at 50% 120%, #FFB300 0%, rgba(255,198,26,0) 75%), #F7F5F1\">приглашаю в мой телеграм-канал →<\u002Fa>\n  <\u002Fdiv>\n<svg width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 40 40\" style=\"position: absolute; top: 144px; left: 1140px\"><polygon points=\"20,0 23.1,12.6 34.1,5.9 27.4,16.9 40,20 27.4,23.1 34.1,34.1 23.1,27.4 20,40 16.9,27.4 5.9,34.1 12.6,23.1 0,20 12.6,16.9 5.9,5.9 16.9,12.6\" fill=\"none\" stroke=\"#161616\" stroke-width=\"1.3\"><\u002Fpolygon><\u002Fsvg><div style=\"position: absolute; left: 47px; top: 172px; font-family: 'Neucha',cursive; font-size: 23px; transform: rotate(-5deg); white-space: nowrap; display: flex; align-items: flex-start; gap: 6px\">МЕТОДИСТ\n          <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 40 40\" fill=\"none\" style=\"margin-top:8px\"><path d=\"M4,4 Q22,8 30,30\" stroke=\"#161616\" stroke-width=\"1.7\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath><path d=\"M21,26 L30,30 L29,20\" stroke=\"#161616\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv><\u002Fsection><div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n\n<!-- ======================= VALUES ======================= -->\n<section data-screen-label=\"Ценности\" style=\"max-width:1240px;margin:0 auto;padding:90px 32px 110px;position:relative\">\n  <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:56px\">\n    <h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:500;font-size:44px\">МОИ ЦЕННОСТИ<\u002Fh2>\n    <sc-if value=\"{{ showDoodles }}\" hint-placeholder-val=\"{{ true }}\">\n      <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 40 40\"><polygon points=\"20,0 23.1,12.6 34.1,5.9 27.4,16.9 40,20 27.4,23.1 34.1,34.1 23.1,27.4 20,40 16.9,27.4 5.9,34.1 12.6,23.1 0,20 12.6,16.9 5.9,5.9 16.9,12.6\" fill=\"none\" stroke=\"#161616\" stroke-width=\"1.3\"><\u002Fpolygon><\u002Fsvg>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:44px 64px;max-width:1060px\">\n    <div style=\"border-top:1px solid #161616;padding-top:22px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:22px\">Человечность<\u002Fh3>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.65\">Я за обучение, где содержание и форма одинаково важны — глубокая методология и человечная подача не исключают друг друга. А проектировать опыт студента не менее важно, чем разработать структуру программы.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #161616;padding-top:22px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:22px\">Глубина<\u002Fh3>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.65\">Мне неинтересно делать «средненько». Если берусь за задачу, то копаю глубоко, делаю с душой — и получаю кайф от детальной проработки.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #161616;padding-top:22px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:22px\">Доказательность<\u002Fh3>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.65\">Хорошее решение опирается на данные. Хотя это не исключает интуицию. В любом случае я всегда стараюсь обосновать каждое решение.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid #161616;padding-top:22px\">\n      <h3 style=\"margin:0 0 12px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:22px\">Значимость<\u002Fh3>\n      <p style=\"margin:0;font-size:16.5px;line-height:1.65\">Верю в агентность студента. Моя цель — создать условия, в которых обучение имеет личный смысл для человека; где через рефлексию, исследование и активные действия студент сам находит ответы на свои вопросы.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:absolute;right:-20px;top:120px;width:480px;height:480px;background:radial-gradient(circle at 50% 50%, #FFC61A 0%, rgba(255,198,26,0) 62%);opacity:{{ blobHalf }};pointer-events:none\"><\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n\n<!-- ======================= PATH / TIMELINE ======================= -->\n\n\n<section data-screen-label=\"Мой путь\" style=\"max-width:1240px;margin:0 auto;padding:90px 32px 100px\">\n  <h2 style=\"margin:0 0 52px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:44px\">МОЙ ПУТЬ<\u002Fh2><div style=\"display:grid;grid-template-columns:340px 1fr;gap:60px;align-items:start\">\n    <div style=\"font-size:16.5px;line-height:1.68\">\n      <p style=\"margin:0 0 18px\">Училась на переводчика, но на третьем курсе стала менеджером проектов в лондонской 3D-студии — и увлеклась этим миром эксклюзива и своей ролью организатора в нем.<\u002Fp>\n      <p style=\"margin:0\">Но потом вылезло, что смысла в этом для меня не было: делать самые красивые картинки в мире было недостаточно. На самом деле я всегда хотела обучать. Просто не знала, что это можно делать не только в школе. А когда узнала, без доли сомнений перешла в образование. И сейчас горю тем, чтобы популяризировать практики учебного дизайна в Беларуси.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"position:relative;width:730px;height:470px\">\n      <svg width=\"730\" height=\"470\" sc-camel-view-box=\"0 0 730 470\" fill=\"none\" style=\"position: absolute; left: 1px; top: 2px\">\n        <defs>\n          <linearGradient id=\"tl-in\" x1=\"30\" y1=\"95\" x2=\"130\" y2=\"60\" sc-camel-gradient-units=\"userSpaceOnUse\">\n            <stop offset=\"0\" stop-color=\"#F7B500\" stop-opacity=\"0\"><\u002Fstop>\n            <stop offset=\"1\" stop-color=\"#F7B500\" stop-opacity=\"1\"><\u002Fstop>\n          <\u002FlinearGradient>\n          <linearGradient id=\"tl-out\" x1=\"560\" y1=\"360\" x2=\"700\" y2=\"410\" sc-camel-gradient-units=\"userSpaceOnUse\">\n            <stop offset=\"0\" stop-color=\"#F7B500\" stop-opacity=\"1\"><\u002Fstop>\n            <stop offset=\"1\" stop-color=\"#F7B500\" stop-opacity=\"0\"><\u002Fstop>\n          <\u002FlinearGradient>\n        <\u002Fdefs>\n        <path d=\"M30,95 Q75,72 130,60\" stroke=\"url(#tl-in)\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n        <path d=\"M130,60 C250,100 360,90 450,80 C620,62 660,120 620,180 C585,230 480,220 400,210 C280,197 130,210 100,280 C80,330 180,355 330,330 C420,315 500,340 560,360\" stroke=\"#F7B500\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n        <path d=\"M560,360 Q640,382 700,410\" stroke=\"url(#tl-out)\" stroke-width=\"6\" stroke-linecap=\"round\"><\u002Fpath>\n        <circle cx=\"130\" cy=\"60\" r=\"6\" fill=\"#F7F5F1\" stroke=\"#161616\" stroke-width=\"1.8\"><\u002Fcircle>\n        <circle cx=\"450\" cy=\"80\" r=\"6\" fill=\"#F7F5F1\" stroke=\"#161616\" stroke-width=\"1.8\"><\u002Fcircle>\n        <circle cx=\"400\" cy=\"210\" r=\"6\" fill=\"#F7F5F1\" stroke=\"#161616\" stroke-width=\"1.8\"><\u002Fcircle>\n        <circle cx=\"330\" cy=\"330\" r=\"6\" fill=\"#F7F5F1\" stroke=\"#161616\" stroke-width=\"1.8\"><\u002Fcircle>\n        <circle cx=\"560\" cy=\"360\" r=\"6\" fill=\"#F7F5F1\" stroke=\"#161616\" stroke-width=\"1.8\"><\u002Fcircle>\n      <\u002Fsvg><div style=\"position: absolute; left: 524px; top: 291px; width: 244px; font-size: 13px; line-height: 1.45; color: #3a3a3a; height: 47px\"><div style=\"font-weight:600;color:#161616;margin-bottom:2px\">2025 – по сей день<\u002Fdiv>Работа автором-методистом в ТРУ<\u002Fdiv><div style=\"position: absolute; left: 257px; top: 358px; width: 180px; font-size: 13px; line-height: 1.45; color: #3a3a3a\"><div style=\"font-weight:600;color:#161616;margin-bottom:2px\">2025–2026<\u002Fdiv>Universal University<\u002Fdiv><div style=\"position: absolute; left: 320px; top: 137px; width: 218px; font-size: 13px; line-height: 1.45; color: #3a3a3a; height: 63px\"><div style=\"font-weight:600;color:#161616;margin-bottom:2px\">2022–2024<\u002Fdiv>Работа Production Manager в Silvershadow studio (Лондон)<\u002Fdiv>\n      <div style=\"position:absolute;left:48px;top:96px;width:190px;font-size:13px;line-height:1.45;color:#3a3a3a\"><div style=\"font-weight:600;color:#161616;margin-bottom:2px\">2015–2019<\u002Fdiv>Лингвогуманитарный колледж<\u002Fdiv>\n      <div style=\"position:absolute;left:384px;top:10px;width:200px;font-size:13px;line-height:1.45;color:#3a3a3a\"><div style=\"font-weight:600;color:#161616;margin-bottom:2px\">2019–2022<\u002Fdiv>БГУИЯ (бывший МГЛУ)<\u002Fdiv>\n      \n      \n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n  \n<\u002Fsection><div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n\n<!-- ======================= NUMBERS ======================= -->\n<section data-screen-label=\"Цифры\" style=\"position:relative;max-width:1240px;margin:0 auto;padding:96px 32px\">\n  <div style=\"position:absolute;left:-40px;top:-40px;width:560px;height:560px;background:radial-gradient(circle at 50% 50%, #FFC61A 0%, rgba(255,198,26,0) 62%);opacity:{{ blobHalf }};pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0\">\n    <div style=\"padding:8px 34px 8px 0\">\n      <div style=\"font-family:'Unbounded',sans-serif;font-weight:500;font-size:78px;line-height:1\">75<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:16px\">написанных уроков<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:8px 34px;border-left:1px solid #161616\">\n      <div style=\"font-family:'Unbounded',sans-serif;font-weight:500;font-size:78px;line-height:1\">15+<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:16px\">сценариев<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">учебные подкасты<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">видео<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">воркшопы<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:8px 34px;border-left:1px solid #161616\">\n      <div style=\"font-family:'Unbounded',sans-serif;font-weight:500;font-size:78px;line-height:1\">10+<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:16px\">организаций, для которых делала обучение<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:8px 0 8px 34px;border-left:1px solid #161616\">\n      <div style=\"font-family:'Unbounded',sans-serif;font-weight:500;font-size:78px;line-height:1\">7<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:16px\">разных сфер<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:14px\">\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">IT<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">телеком<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">банки<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">промышленность и FMCG<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">фэшн-ритейлер<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">креативные индустрии<\u002Fspan>\n        <span style=\"border:1px solid #161616;border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap\">детское образование<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n\n<!-- ======================= CASES ======================= -->\n<section id=\"cases\" data-screen-label=\"Кейсы\" style=\"max-width:1240px;margin:0 auto;padding:90px 32px 110px\">\n  <div style=\"display:flex;align-items:center;gap:18px;margin-bottom:14px\">\n    <h2 style=\"margin:0;font-family:'Unbounded',sans-serif;font-weight:500;font-size:44px\">КЕЙСЫ<\u002Fh2>\n    <sc-if value=\"{{ showDoodles }}\" hint-placeholder-val=\"{{ true }}\">\n      <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 40 40\"><polygon points=\"20,0 23.1,12.6 34.1,5.9 27.4,16.9 40,20 27.4,23.1 34.1,34.1 23.1,27.4 20,40 16.9,27.4 5.9,34.1 12.6,23.1 0,20 12.6,16.9 5.9,5.9 16.9,12.6\" fill=\"#161616\"><\u002Fpolygon><\u002Fsvg>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"font-family:'Neucha',cursive;font-size:21px;margin-bottom:44px;color:#3a3a3a\">нажмите на карточку, чтобы раскрыть детали ↓<\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n    <sc-for list=\"{{ cases }}\" as=\"c\" hint-placeholder-count=\"8\">\n      <div sc-camel-on-click=\"{{ c.open }}\" style=\"cursor:pointer;border:1px solid rgba(22,22,22,.35);background:#F7F5F1;padding:22px 22px 20px;display:flex;flex-direction:column;gap:12px;min-height:240px;transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease\" style-hover=\"border:1px solid #161616;transform:translateY(-4px);box-shadow:0 14px 34px -18px rgba(247,181,0,.9)\">\n        <div style=\"display:flex;justify-content:space-between;align-items:center\">\n          \n          <sc-if value=\"{{ c.fact }}\" hint-placeholder-val=\"{{ false }}\"><\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-family:'Unbounded',sans-serif;font-weight:500;font-size:16.5px;line-height:1.35;flex:1\">{{ c.title }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#3a3a3a\">{{ c.clientShort }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#3a3a3a;border-top:1px solid rgba(22,22,22,.2);padding-top:10px\">{{ c.audience }}<\u002Fdiv>\n        <div style=\"font-size:13.5px;font-weight:500\">подробнее ↗<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n\n<!-- ======================= CTA ======================= -->\n\n\n<section data-screen-label=\"Контакты\" style=\"position:relative;max-width:1240px;margin:0 auto;padding:110px 32px 90px\">\n  <div style=\"position:absolute;left:50%;transform:translateX(-50%);bottom:-100px;width:1100px;height:620px;background:radial-gradient(ellipse at center, #FFBE0F 0%, rgba(255,198,26,0) 62%);opacity:{{ blobOpacity }};pointer-events:none\"><\u002Fdiv>\n  \n<div style=\"position:relative;display:grid;grid-template-columns:1fr 300px;gap:70px;align-items:center\">\n    \n    <div style=\"position: relative\">\n      <div style=\"font-family: 'Unbound F7F5F1\" style-hover=\"background:#161616;color:#F7F5F1\">мой тг-канал<\u002Fa>\n        <a href=\"https://t.me/korolevadubaev\" target=\"_blank\" style=\"text-decoration:none;border:1px solid #161616;border-radius:999px;padding:16px 30px;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:500;background:#F7F5F1\" style-hover=\"background:#161616;color:#F7F5F1\">личный аккаунт<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv><div style=\"position:relative;width:300px;height:380px\">\n      <x-import component-from-global-scope=\"image-slot\" id=\"cta-photo\" shape=\"rect\" placeholder=\"ещё фото\" hint-size=\"300px,380px\"><\u002Fx-import>\n      <sc-if value=\"{{ showDoodles }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 40 40\" style=\"position:absolute;right:-20px;top:-20px\"><polygon points=\"20,0 23.1,12.6 34.1,5.9 27.4,16.9 40,20 27.4,23.1 34.1,34.1 23.1,27.4 20,40 16.9,27.4 5.9,34.1 12.6,23.1 0,20 12.6,16.9 5.9,5.9 16.9,12.6\" fill=\"none\" stroke=\"#161616\" stroke-width=\"1.3\"><\u002Fpolygon><\u002Fsvg>\n      <\u002Fsc-if>\n      \n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fsection><div style=\"max-width:1240px;margin:0 auto;padding:0 32px\"><div style=\"height:1px;background:#161616\"><\u002Fdiv><\u002Fdiv>\n<div style=\"max-width:1240px;margin:0 auto;padding:20px 32px 28px;display:flex;justify-content:space-between;font-size:13.5px;color:#3a3a3a\">\n  <span>Анастасия Королёва — методист / дизайнер учебного опыта<\u002Fspan>\n  <span>Минск · 2026<\u002Fspan>\n<\u002Fdiv>\n\n<!-- ======================= CASE MODAL ======================= -->\n<sc-if value=\"{{ hasActive }}\" hint-placeholder-val=\"{{ false }}\">\n  <div sc-camel-on-click=\"{{ close }}\" style=\"position:fixed;inset:0;background:rgba(22,22,22,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:44px\">\n    <div sc-camel-on-click=\"{{ stop }}\" style=\"position:relative;background:#F7F5F1;border:1px solid #161616;max-width:780px;width:100%;max-height:86vh;overflow:auto;padding:52px 58px 46px\">\n      <button sc-camel-on-click=\"{{ close }}\" style=\"position:absolute;right:20px;top:18px;width:40px;height:40px;border:1px solid #161616;border-radius:999px;background:#F7F5F1;font-size:18px;cursor:pointer;line-height:1\" style-hover=\"background:#161616;color:#F7F5F1\">✕<\u002Fbutton>\n      <div style=\"font-family:'Unbounded',sans-serif;font-size:13px;margin-bottom:16px\">{{ activeCase.num }} / 08<\u002Fdiv>\n      <h3 style=\"margin:0 0 26px;font-family:'Unbounded',sans-serif;font-weight:500;font-size:28px;line-height:1.3\">{{ activeCase.title }}<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:120px 1fr;gap:14px 24px;font-size:16px;line-height:1.6\">\n        <div style=\"font-weight:600\">Заказчик<\u002Fdiv><div>{{ activeCase.client }}<\u002Fdiv>\n        <div style=\"font-weight:600\">Для кого<\u002Fdiv><div>{{ activeCase.audience }}<\u002Fdiv>\n        <div style=\"font-weight:600\">Задача<\u002Fdiv><div>{{ activeCase.task }}<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-if value=\"{{ activeCase.fact }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:16px;margin:24px 0 0;padding:18px 22px;background:radial-gradient(ellipse at 0% 50%, rgba(255,179,0,.5) 0%, rgba(255,198,26,.16) 60%, rgba(255,198,26,.16) 100%)\">\n          <div style=\"font-family:'Neucha',cursive;font-size:28px;line-height:1\">?!<\u002Fdiv>\n          <div style=\"font-size:15.5px;line-height:1.6\">{{ activeCase.fact }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:120px 1fr;gap:14px 24px;font-size:16px;line-height:1.6;margin-top:24px\">\n        <div style=\"font-weight:600\">Решение<\u002Fdiv><div>{{ activeCase.solution }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:28px;font-weight:600;font-size:16px\">Что я сделала<\u002Fdiv>\n      <ul style=\"margin:12px 0 0;padding-left:22px;font-size:15.5px;line-height:1.65;display:flex;flex-direction:column;gap:8px\">\n        <sc-for list=\"{{ activeCase.did }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <li>{{ d }}<\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n      <sc-if value=\"{{ activeCase.poster }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:30px;border:1px dashed #161616;padding:16px 20px;background:repeating-linear-gradient(-45deg, rgba(22,22,22,.04) 0 10px, transparent 10px 20px)\">\n          <div style=\"font-family:ui-monospace,monospace;font-size:13px\">→ подробнее про проект: постер-onepager (ссылка появится позже)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ activeCase.review }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;border:1px dashed #161616;padding:16px 20px;background:repeating-linear-gradient(-45deg, rgba(22,22,22,.04) 0 10px, transparent 10px 20px)\">\n          <div style=\"font-family:ui-monospace,monospace;font-size:13px\">отзыв заказчика: скриншот появится позже<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDoodles&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Декор&quot;},&quot;blobOpacity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.8,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;unit&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Декор&quot;}}\">\nclass Component extends DCLogic {\n  state = { active: null };\n\n  CASES = [\n    {\n      title: 'Обучение эмпатии и саморегуляции',\n      client: 'предпочитает остаться в тени NDA (но может скоро выйти на свет)',\n      clientShort: 'заказчик под NDA',\n      audience: 'операторы колл-центра',\n      task: 'Научить сотрудников инструментам саморегуляции и эмпатии (к себе и клиентам), чтобы снизить текучку и обеспечить выполнение высоких стандартов общения.',\n      fact: 'Главное ограничение — операторы работают по 12 часов и не могут залипать в телефоне на смене. Поэтому уроки уместились в 15 минут, а практика — в упражнения, которые можно сделать прямо на рабочем месте.',\n      solution: 'Креативный асинхронный лонгрид-сериал с сопровождением в телеграм-канале.',\n      did: [\n        'Провела глубинные интервью с аудиторией и стейкхолдерами, чтобы понять боли операторов и собрать кейсы.',\n        'Написала 14 интерактивных уроков со сторителлингом.'\n      ]\n    },\n    {\n      title: 'Программа по технологическому предпринимательству',\n      client: 'Школа 21',\n      clientShort: 'Школа 21',\n      audience: 'школьники 9–10 классов',\n      task: 'Провести исследование ЦА и рынка; предложить концепцию программы, которая поможет юным разработчикам создать сильные проекты, которые можно затем подать на гранты, конкурсы, акселераторы.',\n      solution: 'Программа в духе стартап-акселератора, в рамках которой подростки самостоятельно разработают IT-продукты (без навыков разработчика, но с использованием ИИ) в продуктовом подходе: от анализа рынка и потребностей пользователей до разработки MVP и питчинга своего решения перед экспертами.',\n      did: [\n        'Провела анализ рынка и конкурентов.',\n        'Разработала онлайн-анкетирование для опроса аудитории (получили 175 ответов).',\n        'Провела глубинные интервью с целевой аудиторией.',\n        'Обработала результаты исследования, представив заказчику выводы и рекомендации.',\n        'Разработала с командой методистов концепцию программы.',\n        'Описала архитектуру программы и карту учебного опыта (SJM).'\n      ],\n      poster: true,\n      review: true\n    },\n    {\n      title: 'Программа для развития лидерских навыков',\n      client: 'предпочитает остаться в тени NDA',\n
